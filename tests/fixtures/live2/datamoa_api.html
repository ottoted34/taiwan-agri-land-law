    <script>
        var mc;
        var url = window.location.href, idx = url.indexOf("#")
        var hash = idx != -1 ? decodeURIComponent(url.substring(idx + 1)) : "";

        window.onload = function () {
            var rnd = Math.random();
            // Build a system
            const ui = SwaggerUIBundle({
                url: "https://data.moa.gov.tw/openapi.json?rnd=" + rnd,
              dom_id: '#swagger-ui',
              deepLinking: false,
              presets: [
                  SwaggerUIBundle.presets.apis,
                  SwaggerUIStandalonePreset
              ],
              plugins: [
                  SwaggerUIBundle.plugins.DownloadUrl
              ],
              layout: "BaseLayout",
              onComplete: function () {
                  //var hash = decodeURIComponent(window.location.hash.replace(/^#!/, ''));
                  //if (hash) {

                    //    $('html,body').animate({
                    //        scrollTop: $(hash).offset().top - 80
                    //    }, 500);
                    //}
                }
            });

            window.ui = ui;


            (function () {
                $.ajax({
                    url: "/openapi_menu.json",
                    dataType: 'json'
                }).done(function (data) {
                    if (data['menu'].length) {
                        var selectContainer = document.getElementById('select-container');
                        data['menu'].forEach(function (menu, index) {
                            var child;
                            if (menu.child.length) {
                                child = document.createElement('div');
                                child.className = "select-sub-link";
                                var btn = document.createElement('a');
                                btn.className = "select-link-btn";
                                btn.id = "sub-link-" + index;
                                btn.dataset.href = "#" + menu.position;
                                btn.dataset.toggle = "is-opened";
                                btn.innerHTML = "<span>" + menu.name + "</span> <i class='last fas fa-angle-down'></i>";

                                var sub = document.createElement('div');
                                sub.className = "select-sub-menu";
                                var subHtml = "<div class='wrapper'>";
                                menu.child.forEach((function (c) {
                                    subHtml += "<a class='select-link-btn scroll-btn-a' data-href='#" + c.position + "' data-toggle-close='active' data-parent='.select-link-wrapper'";
                                    subHtml += "data-btn-id='#sub-link-" + index + "'><span>" + c.name + "</span></a>";
                                }));

                                subHtml += "</div>";
                                sub.innerHTML = subHtml;

                                child.appendChild(btn);
                                child.appendChild(sub);

                            } else {
                                child = document.createElement('a');
                                child.className = "select-link-btn scroll-btn-a";
                                child.dataset.href = "#" + menu.position;
                                child.innerText = menu.name;

                            }
                            if (child) {
                                selectContainer.appendChild(child);
                            }
                        });
                    }

                    $('#select-container [data-toggle]').click(function () {
                        let className = $(this).data('toggle')
                        $(this).toggleClass(className);
                    });

                    $('#select-container [data-toggle-close]').click(function () {
                        let parent = $(this).data('parent');
                        let className = $(this).data('toggle-close');
                        $(this).parents(parent).find('[data-toggle=' + className + ']').removeClass(className);
                    });


                    $('.scroll-btn-a').click(function (e) {
                        var headerHeight = $('.main-header').height();
                        e.preventDefault();
                        var curLink = $(this);
                        var hash = $(this).data('href');
                        var scrollPoint = $(hash).offset().top - headerHeight;
                        $('body,html').animate({
                            scrollTop: scrollPoint
                        }, 500);
                        if (history.pushState) {
                            history.pushState(null, null, hash);
                        }
                        else {
                            location.hash = hash;
                        }
                    })
                });
            })();

        }


    </script>
