# 民國112年8月1日行政院農業委員會改制為農業部。
# 本表僅記錄「業務承接」對照，不代表舊機關發布之函釋當然繼續適用（見 docs/update-policy.md）。
# match: 用於辨識函釋文號或發文機關文字中的歷史機關名稱
reorg_date: "2023-08-01"
mappings:
  - historical: 行政院農業委員會
    aliases: [農委會, 農業委員會]
    successor: moa
    note: 改制為農業部
  - historical: 行政院農業委員會農糧署
    aliases: [農委會農糧署]
    successor: afa
  - historical: 行政院農業委員會水土保持局
    aliases: [水土保持局, 水保局]
    successor: ardswc
    note: 與農村發展相關業務整併為農村發展及水土保持署
  - historical: 行政院農業委員會林務局
    aliases: [林務局]
    successor: forest
    note: 改制為林業及自然保育署
  - historical: 行政院農業委員會漁業署
    successor: fa
  - historical: 行政院農業委員會動植物防疫檢疫局
    aliases: [防檢局]
    successor: aphia
  - historical: 行政院農業委員會農業試驗所
    successor: tari
  - historical: 行政院農業委員會桃園區農業改良場
    successor: tydares
  - historical: 行政院農業委員會苗栗區農業改良場
    successor: mdares
  - historical: 行政院農業委員會臺中區農業改良場
    successor: tcdares
  - historical: 行政院農業委員會臺南區農業改良場
    successor: tndais
  - historical: 行政院農業委員會高雄區農業改良場
    successor: kdais
  - historical: 行政院農業委員會花蓮區農業改良場
    successor: hdares
  - historical: 行政院農業委員會臺東區農業改良場
    successor: ttdares
  - historical: 行政院農業委員會茶業改良場
    aliases: [茶業改良場]
    successor: tbrs
    note: 改制為茶及飲料作物改良場
  - historical: 行政院農業委員會種苗改良繁殖場
    successor: tss
  - historical: 行政院農業委員會企劃處
    aliases: [農委會企劃處]
    successor: ardswc
    note: 農地利用管理相關業務（含農業設施容許使用、農用證明制度）改制後由農村發展及水土保持署主政；個別案件以函釋原文為準
# 函釋文號字頭（如「農企字」「農保規字」）與機關之對應僅供辨識輔助，不作效力判斷。
doc_prefixes:
  農企字: {historical: 行政院農業委員會企劃處, era: pre-2023}
  農授企字: {historical: 行政院農業委員會（授權企劃處）, era: pre-2023}
  農保規字: {agency: ardswc, era: post-2023}
  農授農保字: {agency: moa, note: 農業部授權農村發展及水土保持署, era: post-2023}
  農農保字: {agency: moa, era: post-2023}
  # 農糧署自行發文之字頭（「農授糧字」為農委會／農業部授權農糧署，仍屬農業部名義，不在此列）
  農糧字: {agency: afa, historical_name: 行政院農業委員會農糧署}
  農糧企字: {agency: afa, historical_name: 行政院農業委員會農糧署}
  農糧資字: {agency: afa, historical_name: 行政院農業委員會農糧署}
  農糧產字: {agency: afa, historical_name: 行政院農業委員會農糧署}
