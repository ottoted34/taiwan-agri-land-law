# 官方資料來源登錄檔（機器可讀）。docs/source-audit.md 為人類可讀版本。
# audit_status 只能為下列之一：
#   synced_full        已完整盤點且可自動同步
#   synced_partial     已盤點但只能部分同步
#   manual             已盤點且需人工補充
#   pending_license    已找到來源但尚未取得授權（或 robots.txt 不允許自動擷取）
#   not_identified     尚未確認有適當資料來源
#   discontinued       官方來源已停用
#   unreachable        來源暫時無法連線（自 GitHub Actions 海外主機）
#   no_relevant_data   經查核沒有與本專案相關的公開資料
# 「已同步」不代表歷史文件全部收錄；每月 source-audit 會自動重新檢查連線與 robots 規則。
last_reviewed: 2026-10-30
