- docno: 農授糧字第1040230847號
  date: '2015-10-06'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 104年10月06日農授糧字第1040230847號函(魚菜共生)基於農業設施係輔助經營管理使用,須與農業經營密切相關,故申請設施要求所提之經營計畫內容須具合理性,並符合與農業經營之相當、必要性等原則。所稱「魚菜共生」,倘依貴府所敘,係於同一空間及同一設施,作農作及水產養殖等2種農業生產行為,為免造成申請設施面積藉以累加,宜以設施之主要用途予以審認核處,先予敘明。本案從事2種農業生產行為使用之農業設施,應逕依申請人所提主要用途之設施種類予以受理,並就該設施與農業經營之相當、必要性予以審認。至主要用途之認定倘有疑義,地方政府再按設施與經營之必要性、投資金額、產值等作為判斷依據,均屬適宜。另針對兼具之使用方式,宜請申請人於經營計畫明敘,始得就其相容性予以審認核處,並確保所申請設施依核定經營計畫內容使用。
- docno: 農糧企字第1041026287號
  date: '2016-01-18'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 105年1月18日農糧企字第1041026287號函(第13條第3項)容許辦法第13條第3項規定之車輛運(迴)轉空間不列計於興建面積,應指對應附表1所列設施細目之申請基準或條件之可興建面積,雖不受該設施細目之可興建面積限制,惟附屬設施亦為農業設施之部分。爰車輛運(迴)轉空間之興建面積,除符合容許辦法第7條第1項但書規定之情形者外,其所有農業設施總面積,依同項規定仍不得超過申請設施所坐落之農業用地土地面積之40%。
- docno: 農糧企字第1051000471號
  date: '2016-01-18'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 105年1月18日農糧企字第1051000471號函倘原申請集貨場之農業設施,供作「住宅」使用,即已違反上開農業設施容許使用及土地使用管制規定,且貴府亦依區域計畫法裁罰有案。故本案違規情節尚未排除前,再次申請農業用地作農業設施之容許使用,核屬容許辦法第6條第9款所稱「違反其他土地使用管制相關法令規定」之情形,應依規定不予同意。又查卷附申請資料,所擬申請變更之經營計畫涵蓋假日農夫市集、行銷在地農產品等使用內涵,非屬容許辦法第13條第1項第3款所定農產運銷加工設施,係供放置集貨、包裝、儲存、冷凍(藏)、加工及批發市場等設備及作業場所之設施之範疇。爰集貨運銷處理設施未宜作為假日農夫市集、行銷在地農產品等使用內涵。另查104年9月4日修正發布之「農業用地興建農舍辦法」第2條明定,興建農舍須提送經營計畫,以確保該農業用地確供農業使用,並不得影響農業生產環境及農村發展。又同辦法第5條第1項第5款亦明定,申請興建農舍之農業用地,有其他違反土地使用管制規定者,不得申請興建。爰除加強申請農舍興建之經營計畫審核外,針對本案之農業設施已違規作住宅使用,擬逕將設施直接以申請興建農舍方式取得合法化之情形,依容許辦法及上開農舍辦法規定,在違規情節未排除前,應不得同意農舍之申請
