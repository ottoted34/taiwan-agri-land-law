- docno: 農糧企字第1080727168號
  date: '2019-11-04'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 108年11月4日農糧企字第1080727168號函考量菇類產業需求,菇類培植廢棄包處理及再利用係屬專業之技術,協助處理菇類栽培場所產生之廢棄菇包,對於菇農及菇產業確有助益,單獨設置菇類培植廢棄包處理場尚屬合宜,惟剩餘農地仍應有農業使用行為。至得否於菇類培植廢棄包處理場將廢棄介質製成木質顆粒作為生質燃料一節,查容許辦法第13條附表1所定菇類培植廢棄包處理場之申請基準或條件,並無處理後續再製造生質燃料(造粒)之規範或限制,惟廢棄菇包原料加工製成生質能源燃料之製程複雜,已涉環保、消防等公共安全專業,仍須符合相關法規始得辦理。
