items:
- docno: 內地字第8202898號
  date: '1993-03-05'
  course:
  - 農業部農村發展及水土保持署「農業用地作農業使用認定之法令說明及行政實務」（115年6月）
  - 農業部農村發展及水土保持署「農業用地作農業設施容許使用相關法規與實務」（115年5月）
  excerpt: '依內政部82年3月5日台(82)內地字第8202898號函釋所列文件辦理:編定公告前已作該項使用之航照圖或基本圖編定公告前,其地目足以顯示作該項使用之地籍謄本編定公告前相關機關核准或證明已作該項使用之文件其他足堪證明在編定公告前已作該項使用之相關文件現雖為非都市土地,惟於非都市土地使用編定前,已發布實施都市計畫,則因都市計畫發布實施後,即有土地使用管制及建築管理之實施,依從來使用之意旨,係以土地使用管制之時點予以審認,因此,應以該都市計畫發布實施之時點認定之。都市計畫非都市計畫


    *從來使用之認定文件(內政部82年3月5日台82內地字第8202898號函)可由縣市政府主動查證或由土地所有權人(或使用人)檢具下列文件之一:(一)編定公告前已作該項使用之航照圖或基本圖,(二)編定公告前,其地目足以顯示作該項使用之地籍謄本,(三)編定公告前相關機關核准或證明已作該項使用之文件,(四)其他足堪證明在編定公告前已作該項使用之相關文件。經當地縣市政府認定確為編定前已作該項使用後,准予維持從來之使用。'
- docno: 內地字第8588001號
  date: '1996-10-05'
  course:
  - 農業部農村發展及水土保持署「農業用地作農業設施容許使用相關法規與實務」（115年5月）
  excerpt: 1.如無法取得全數共有人之土地使用同意書,依農業部相關函釋說明得依土地法第34條之1規定辦理,且應依同法第34條之1執行要點第3點規定,以有償或不影響不同意共有人之利益為限。(內政部85年10月5日台(85)內地字第8588001號函,按土地法第34條之1第1項所稱「變更」,係指變更共有物之本質或其用途而言。非都市土地申請容許使用,屬變更共有物用途之一,應有土地法第34條之1之適用。)
    2.查土地法第34條之1並未區分都市計畫土地或非都市土地,始得適用,故都市計畫農業區之共有農業用地申請農業設施容許使用,倘因無法徵得全體共有人之書面同意,仍得循土地法第34條之1規定辦理。 3.至共有人倘擬以民法第820條所為之多數決分管證明書圖文件,作為共有人之土地使用同意書,則該文件應具體載明該共有人同意申請人得為農業設施使用之意思表示,始符合前開法令規定之要件。補充1
- docno: 內營字第8904763號
  date: '2000-04-24'
  course:
  - 農業部農村發展及水土保持署「農業用地作農業使用認定之法令說明及行政實務」（115年6月）
  - 農業部農村發展及水土保持署「農業用地作農業設施容許使用相關法規與實務」（115年5月）
  excerpt: '(1)依內政部89年4月24日台89內營字第8904763號函釋所列文件之一辦理:建築執照建物登記證明未實施建築管理地區建築物完工證明書載有該建築物資料之土地使用現況調查清冊或卡片之謄本完納稅捐證明繳納自來水費或電費證明戶籍遷入證明地形圖、都市計畫現況圖、都市計畫禁建圖、航照圖或政府機關測繪圖等(2)由建設或工務單位審認。 【補充說明】編定公告前之合法房屋之證明文件


    *合法建築物之認定文件(內政部89年4月24日台89內營字第8904763號函)實施建築管理前已建造完成之合法建築物之證明文件之ㄧ,包括建築執照、建物登記證明、未實施建築管理地區建築物完工證明書、載有該建築物資料之土地使用現況調查清冊或卡片之謄本、完納稅捐證明、繳納自來水費或電費證明、戶口遷入證明、地形圖、都市計畫現況圖、都市計畫禁建圖、航照圖或政府機關測繪地圖等。'
- docno: 台內營字第9082895號
  date: '2001-03-19'
  course:
  - 農業部農村發展及水土保持署「農業用地作農業使用認定之法令說明及行政實務」（115年6月）
  excerpt: 4.復依內政部90年3月19日台內營字第9082895號函:「臺灣省都市計畫保護區土地,無論何種地目,均得准予農業使用,惟其使用仍應符合上開施行細則第28條及各該都市計畫書之規定,以落實保護區之國土保安、水土保持、維護天然資源及保護生態功能。」因此,維持原有地形地貌,且未有人為利用及設置設施情形,尚可認屬具維護國土保安之保育使用性質。倘認定屬森林法所稱林地,符合造林認定原則,亦可認屬森林使用。
- docno: 農企字第0950174078號
  date: '2007-01-14'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: （課程引用脈絡：103年1月29日農授糧字第1030701393號函）有關本案坐落農業用地界址內作道路使用之部分，倘經地方主管機關審認係為農業經營所需之農路，則仍屬農業使用範疇，於核計農業資材室興建面積時，其面積得免予扣除；至該道路倘經審認非屬農業使用部分，仍宜參依本會96年1月14日農企字第0950174078號函說明三先行扣除「非農業使用」之設施面積後，再予核算農業資材室可興建之面積。
- docno: 農企字第0990011270號
  date: '2010-12-29'
  course:
  - 農業部農村發展及水土保持署「農業用地作農業使用認定之法令說明及行政實務」（115年6月）
  excerpt: 依改制前行政院農業委員會99年12月29日農企字第0990011270號函:都市計畫土地除農業區及保護區仍屬農業用地之範圍,得申請核發農業用地作農業使用證明書外,其他各種使用分區或用地,包括90年10月8日(90)農企字第900153204號函規定之都市計畫行水區、河川區或洪水平原一級管制區之土地,均得申請核發「農業發展條例第38條之1土地作農業使用證明書」。農業用地依法變更為都市計畫非農業用地都市計畫行水區、河川區、洪水平原一級管制區
    2.權責分工:農業:是否農業用地變更、現況作農業使用→農業發展條例第38之1土地作農業使用證明書都計:是否符合第1項第1款或第2款→分區使用證明書稅捐:稅賦優惠之准駁農業發展條例第38條之1(都計土地)
