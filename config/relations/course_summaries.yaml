  excerpt: 依內政部營建署105年6月8日營署建管字第1052909855號函,「合法房屋」認定之基準日期:1.在實施都市計畫地區,係指當地都市計畫公布實施之日期。2.在實施區域計畫地區,係指當地依區域計畫法第15條第1項劃定使用分區並編定各種使用地公布之日期。3.前2項以外地區,本部訂頒「都市計畫以外地區建築管理辦法」,依該辦法指定實施地區之日期亦適用之。
