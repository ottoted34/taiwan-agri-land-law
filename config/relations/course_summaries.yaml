  excerpt: (115年4月10日農授農保字第1150703574號)一、依申請農業用地作農業設施容許使用審查辦法申設地面型綠能設施之附屬設施(下稱綠能附屬設施),其審認原則,農業部前業以114年1月23日農農保字第1142655512號函及114年7月3日農農保字第1142656005號函說明在案。二、針對漁電共生案場倘有設置綠能附屬設施規模超過45平方公尺需求者,得於案場內,設置有綠能設施之同一地號土地,依非都市土地使用管制規則規定,向能源主管機關申請面積660平方公尺以下之公用事業設施。
