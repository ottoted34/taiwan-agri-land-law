  excerpt: 105年6月16日農糧企字第1050716690號書函釀製啤酒得否申請農糧產品加工室一節,涉關所使用之農糧產品有無連結農業生產之事實,查一般啤酒之製作多以麥芽為主要原料,經添加啤酒花取得獨特風味後發酵而成,自應檢視麥芽之來源是否確實鏈結地區農業生產,惟鑑於啤酒款式多元,其製程及原料使用或有差異,爰申請案應由容許使用受理機關依「基於農業生產之事實」及「連結農業生產」之旨意,就申請人所提經營計畫書內容,按設施與農業經營之必要性及合理性予以審認。
