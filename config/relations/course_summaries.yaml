  excerpt: 113年5月24日農授糧字第1131148646號函「溫網室擋水設施」:興設位置包括結合溫網室設施或設置於溫網室設施周圍,規格以砌磚牆或更高等級固定材料(如鋼筋混凝土等),牆面厚度至少12公分、地面高度至少60公分,以不超過80公分為原則。位於溫網室設施周圍之「溫網室擋水設施」,得依容許辦法第13條附表1「其他農作產銷設施-其他(溫網室擋水設施)」細目提出申請。上開溫網室擋水設施倘結合溫網室者(即共構於溫網室結構中),則需依規定申請溫(網)室容許使用並依地方政府建築管理單位規定辦理。
- docno: 農保規字第1140228604號
  date: '2025-08-04'
  course:
  - 農業部農村發展及水土保持署「農業用地作農業設施容許使用相關法規與實務」（115年5月）
  excerpt: '*綠能設施之附屬設施「變電箱」適用範圍(114年8月4日農保規字第1140228604號)一、綠能設施之太陽能設施,係指太陽能板及其附屬設施(如變電箱、電桿),並不包含輸配電設施(如變電站、升壓站)等建築物或雜項工作物,故倘非屬太陽能板、變電箱或電桿,尚無旨揭辦法所定綠能設施之適用。二、經濟部能源署表示「變電箱」係通俗用法,於電業法及其他法規未有定義一節,考量再生能源發電設施及設備項目眾多,尚難界定適用範圍,爰以「變電箱」統稱,並於前開2函說明其設置面積等基準條件。是以,來函所提再生能源發電設備及其附屬設施之設置面積及基準條件,倘符合農業部114年1月23日及114年7月3日函釋之審認原則,尚得以「變電箱」申設;至變電站(所)、升壓站、開閉所等,因具建築物或雜項工作物構造,依農業部114年1月23日函說明,非屬綠能設施之附屬設施。'
