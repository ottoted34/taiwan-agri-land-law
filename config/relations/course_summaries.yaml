- docno: 農糧企字第1030703520號
  date: '2014-02-24'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 103年2月24日農糧企字第1030703520號函本案現況農路係跨越數筆土地,建議貴府輔導鄰地土地所有權人一併提出該農路之容許使用申請,惟倘未能一併提出申請,則就受理○君申請案件,依「申請農業用地作農業設施容許使用審查辦法」規定核處。
- docno: 農糧企字第1031009062號
  date: '2014-06-16'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 103年6月16日農糧企字第1031009062號函民眾申請農業用地作農業資材室容許使用,興建於二筆農業用地上,農業資材室坐落之農業用地面積達0.1公頃以上者,即得依上揭規定申請該設施之容許使用,尚無需先將坐落土地合併後再行申請。
- docno: 農授糧字第1031010906號
  date: '2014-07-09'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 103年7月9日農授糧字第1031010906號函有關以玻璃溫室搭建,從事農作物及藻類生產,申請農業用地作農業設施容許使用審查疑義,查申請農業用地作農業設施容許使用審查辦法(以下簡稱容許辦法)第13條第 2項附表1所定「農作產銷設施-溫室及植物環控栽培設施」之申請基準或條件規定「溫室應以透光材質搭建,並得配置溫度控制及換氣裝置」是以,溫室應以可透光之材質搭建,供為農業直接生產及經營使用。按水耕栽培(養液栽培)為農作物栽培生產方式之一,自可依規定申請農業設施容許使用。另查容許辦法第21條第2項附表4所定「水產養殖設施-室內水產養殖生產設施」之申請基準或條件規定,其室內養殖池最小設置比例及室內養殖生產類別設施最大興建面積比例規定,與上開農作產銷設施規定不同。爰此,本案允請申請人分案並區分設施後,由貴府本權責核處。
