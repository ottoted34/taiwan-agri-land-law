  excerpt: 103年8月14日農糧企字第1031012987號函所詢得否於農業資材室放置耕耘機及碾米機一節,依容許辦法規定,允有未宜,申請人倘確有放置耕耘機及碾米機之需求,允依上開規定申請農機具室及碾米機房容許使用,及檢附自有耕耘機之農機使用證。另碾米機房部分尚無規定應檢附碾米機之農機使用證。
- docno: 農企字第1030227769號
  date: '2014-08-19'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 103年8月19日農企字第1030227769號函(第14條第1項)依本會102年10月9日修正發布「申請農業用地作農業設施容許使用審查辦法」(以下簡稱容許辦法)第7條第1項但書第4款規定略以,申請本辦法所定各項農業設施,有第9條規定之情形者,其所有農業設施總面積,得不受申請設施坐落之農業用地土地面積40%之限制。復依容許辦法第9條規定:「主管機關辦理、專案核准或輔導農業發展計畫所需之農業設施,其面積及高度,得依其計畫核定之。」是以,前開規定應係指「專案核准」之「農業發展計畫所需之農業設施」,始能依其計畫核定之面積及高度興建,而得不受容許辦法第7條第1項:「不得超過申請設施坐落之農業用地土地面積之40%」及容許辦法第8條規定:「農業設施興建高度及樓層應依本辦法規定辦理;未規定高度之農業設施,其高度不得超過14公尺」之限制。至容許辦法第14條(第1項)經中央主管機關專案核准之規定,係指農業設施之設置基準或條件不受附表1規定之限制,查並未排除不受容許辦法第7條或第8條規定之限制。準此,農業設施容許使用案件,倘擬依容許辦法第14條規定採專案核准方式辦理,貴署仍可先審酌是否符合容許辦法第9條規定之農業發展計畫所需者,並依農業發展計畫內就農業設施
