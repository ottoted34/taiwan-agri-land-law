  excerpt: 114年12月2日農糧資字第1141028345號函查「申請農業用地作農業設施容許使用審查辦法」(以下簡稱容許辦法)第13條附表1 所定「農糧剩餘副產物集貨加工室(場)」申請基準及條件略以,該項設施係作為稻草、稻殼、竹木、果樹枝(皮)、花卉殘株及其他農糧剩餘副產物之集貨、加工場所及設施使用。農糧剩餘副產物之來源必須為農業生產經營過程中所剩餘之生物性副產物,旨案所詢「木碳、生物碳、木醋液、乾燥後鳳梨果皮」其所使用之加工原料應係屬農糧剩餘副產物,非農糧產品加工室之範疇。
