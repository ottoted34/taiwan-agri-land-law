  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 112年2月1日農糧企字第1110732118號函申請農糧剩餘副產物集貨加工室之農業用地,應具農業生產事實,且該集貨加工室應主供處理該農業用地產生之農糧剩餘副產物,惟考量農糧剩餘副產物之處理具專業技術,可協助處理他筆農業用地農糧生產經營過程中所剩餘之生物性副產物,建議可由申請人於經營計畫敘明,及檢具契作、收受等證明文件作為佐證,其合理之申設面積,建議可依申請人之經營計畫書內容所述農糧剩餘副產物種類、來源與預估數量、再利用處理方式所需相關設備與數量及每日處理量與產出量等,併同貴轄農糧作物實際種植習慣及副產物預估量等核實審認。(114.12.31改為農糧剩餘資源循環設施)又農糧剩餘副產物如屬「農業事業廢棄物再利用管理辦法」第3條附表1所列之再利用種類者,例如果菜批發市場所產生之果菜殘渣,其清運及再利用方式應依前開管理辦法規定辦理。
