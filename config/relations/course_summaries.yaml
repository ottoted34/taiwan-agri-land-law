- docno: 農企字第1060226404號
  date: '2017-09-20'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 106年9月20日農企字第1060226404號函依據本會106年6月28日修正發布之申請農業用地作農業設施容許使用審查辦法(以下簡稱容許辦法)第13條附表1農業資材室、管理室之申請基準或條件分別規定,坐落之農業用地已興建農舍者,不得申請興建農業資材室、管理室。按其立法意旨係鑒於農舍已有農業資材室及管理室之使用性質,已興建農舍之土地不宜再興建農業資材室或管理室,合先敘明。上開申請基準或條件「坐落之農業用地『已興建』農舍者」係就申請農業資材室或管理室之時點,現勘該申請之土地是否已有農舍(含興建中或已完工),並以取得建造執照為審查基準,實務執行可請建築主管單位於申請農業用地作農業設施容許使用案件審查簽辦單另審認該筆土地是否申請興建農舍在案。
- docno: 農企字第1060234814號
  date: '2017-09-27'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 106年9月27日農企字第1060234814號函依據容許辦法第6條第1項第4款後段規定:申請農業用地作農業設施容許使用,有「申請人經營之其他農業用地或農業設施有閒置未利用或未符合規定使用之情形」,不予同意,其實務執行係依申請人按容許辦法第4條規定所提具之文件予以審查,無須另檢附財產清冊等文件,並就行政機關已掌握之事實及證據予以審認。申請人檢附全國財產稅總歸戶財產查詢清單係為說明容許辦法第13條附表1所定農業資材室無可避免使用特定農業區農牧用地之理由,與上開容許辦法第6條第1項第4款後段規定之實務執行係屬二事,故本案是否涉及該款規定,仍請該府依前揭函釋予以審認。案例:甲君於A地號原經○府於96年05月14日核發農業用地作農業設施(菇類栽培場)容許使用同意書有案,該設施於96年11月09日建築完成後,違規作工廠使用,於104年12月30日廢止前開農業設施容許使用同意書。後甲君於A地號對面之B地號再次申請菇類栽培場,因原於A地號設置之農業設施未依計畫使用且未作農業使用,不具「再次設置相同農業設施之合理性、必要性」。
