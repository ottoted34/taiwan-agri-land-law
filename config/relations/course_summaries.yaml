  excerpt: 依據行政院農業委員會農糧署110年1月6日農糧企字第1090257377號函(如附件)說明二:「 ......按農業設施係為輔助農業生產或經營管理需求而附屬設置之相關設施,且所請之設施須有連結農業生產經營之事實,故農糧產品加工室係為農業生產之附屬設施,營運型態簡單,又實際經營以自家人力為主,人員進出單純,與休閒農場附設之農產品加工(釀造)廠具休閒觀光功能不同。......」爰有關非位於休閒農場遊客休憩分區內,依照申請農業用地作農業設施容許使用審查辦法申請之農糧產品加工室,應非屬供公眾使用建築物。
