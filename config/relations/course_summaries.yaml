  excerpt: 108年2月22日農糧企字第1081003386號函按農委會106年9月21日研商「農業設施附屬設置綠能設施之既有案件處理原則」第3 次會議紀錄決議(諒達)略以「基於容許辦法於106年6月28日修正發布,故屬違規改善中案件,仍得依原經營計畫申請之農業設施類型進行改善。」本案依卷附貴縣○○鄉公所(以下簡稱該公所)108年1月30日○鄉農字第10830122800 號函說明,係領有該公所105年4月27及28日所核發之網室容許使用同意書,因未依原核定計畫內容使用,經該公所通知申請人限期改善在案,係屬違規改善中案件,依上開會議決議,仍得依原經營計畫之農業設施類型進行改善,適用容許辦法106年6月
    28日修正前之規定辦理。又本案核定之網室既經該公所通知申請人限期改善,顯示該網室現有日照不足致影響作物生長及農業常態經營,後續改善倘為恢復網室栽培生產使用,應確保提供足夠日照以利種植作物生長,其太陽能板比例依網室面積40%以下為原則。 26
