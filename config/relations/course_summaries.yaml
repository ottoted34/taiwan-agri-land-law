  excerpt: （課程引用脈絡：本件為鄉公所函，課程於說明網室附屬綠能違規改善案件時引用）本案依卷附貴縣○○鄉公所108年1月30日○鄉農字第10830122800號函說明，係領有該公所105年4月27及28日所核發之網室容許使用同意書，因未依原核定計畫內容使用，經該公所通知申請人限期改善在案，係屬違規改善中案件，依上開會議決議，仍得依原經營計畫之農業設施類型進行改善，適用容許辦法106年6月28日修正前之規定辦理。
- docno: 農糧企字第1081060231號
  date: '2019-02-21'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 108年2月21日農糧企字第1081060231號(第13條第3項)農業資材室容許使用附屬設置衛生設備之審認查申請農業用地作農業設施容許使用審查辦法(以下簡稱容許辦法)第13條第3項規定略以「得依實際需求,配置車輛運(迴)轉空間、附屬設施所需空間及衛生設備。」按其附屬設置之衛生設備之立法目的係僅提供最基本生理需求之廁所始予設置之考量。鑒於農業設施係基於農業生產事實所必要之輔助經營管理使用,故應與農業經營密切相關,因此容許辦法第4條規定,申請時須提具經營計畫,並由主管機關就經營計畫合理性,及所申請設施與農業經營必要性、相當性,予以審認核處。另按容許辦法33
    條規定,農業設施不得作為住宅、工廠等非農業使用。考量衛生設備係依容許辦法第 13條第3項規定附屬設施,爰其配置空間自應衡量與申請之農業設施之主從關係性,由申請人所擬具之經營計畫,依上開規定予以審認。又為確保農業生產環境之完整,避免地下水或土壤污染,農業設施之施設及廢、污水排放,自不得影響周邊供農作物種植之土壤,爰農業資材室附屬設置之衛生設備,應加強經營計畫之引用水來源及廢、污水處理審查,並符合環保及水利相關法規之規範。
