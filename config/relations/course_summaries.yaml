- docno: 農授糧字第1090209812號
  date: '2020-03-17'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 109年3月17日農授糧字第1090209812號函查農業用地興建農舍辦法第12條規定略以「......已申請興建農舍之農業用地,......未經解除套繪管制不得辦理分割。已申請興建農舍領有使用執照之農業用地經套繪管制,除符合下列情形之一者外,不得解除:......三、農舍用地面積與農業經營用地面積比例符合法令規定,經依變更使用執照程序申請解除套繪管制後,該農業用地面積仍達0.25公頃以上。......」。另查申請農業用地作農業設施容許使用辦法(以下簡稱容許辦法)第13條附表1所定農業資材室及管理室之申請基準或條件略以,坐落之農業用地已興建農舍者,不得申請興建農業資材室。合先敘明。依來函所述,○君申請X地號土地作農業資材室容許使用,惟該筆土地謄本註記已受農舍套繪管制,縱使該筆土地有作農業經營且無蓋其他農業設施,倘土地未符解除套繪管制規定,仍應維持套繪限制。爰上,本案農舍未坐落之農業用地,允先依上開規定解除套繪管制後,再依容許辦法規定申請農業資材室容許使用。
