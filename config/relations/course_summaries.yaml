- docno: 農授糧字第1061018395號
  date: '2017-09-27'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 106年9月27日農授糧字第1061018395號函設施屋頂附屬設置綠能設施,建議應優先設置於不透光之附屬設施空間後,始得在不影響作物生育前提下,平均分散設置於植物栽培區屋頂,以維持足夠之日照穿透。至植物栽培區屋頂附屬設置綠能設施,依容許辦法第28條規定,申請人應檢附農業經營實績之證明文件,並經直轄市、縣(市)主管機關查核確有農業經營事實,且符合原核定之計畫內容使用,故上開擬附設之綠能設施自應配合原核定計畫之農業生產狀態予以搭建,作為審查與農業經營是否相容及結合之依據。
- docno: 農糧字第1060237036號
  date: '2017-10-13'
  course:
  - 農業部農糧署「申請農業用地作農作產銷設施容許使用之行政實務」（115年5月）
  excerpt: 106年10月13日農糧字第1060237036號函查申請農業用地作農業設施容許使用審查辦法(以下簡稱容許辦法)第6條規定略以「申請農業用地作農業設施容許使用,有下列情形之一者,不予同意:......九、違反其他土地使用管制相關法令規定。」又本會101 年8 月23 日農企字第10101270758號函略以「有關受理農業用地作農業使用證明案件或農業設施容許使用案件,該農業用地上有先行施作之設施物,倘確係為作農業使用之農業設施,符合容許辦法及相關審查規定者,應輔導補辦申請容許使用。」本案原合法集貨場為附屬設置綠能設施,依容許辦法第4條及第28條規定申請容許使用,如該筆土地上有其他未申請之農業設施,允依前開容許辦法及函釋規定,輔導補辦申請容許使用,以符法制。
