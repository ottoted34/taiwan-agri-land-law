  excerpt: 105年3月21日農糧儲字第1051004864號函該農會並已依計畫規定將計畫工程規劃書及設計圖送本署委託之財團法人農業機械化研究發展中心進行書面審查通過,據以辦理採購及工程施設。依「申請農業用地作農業設施容許使用審查辦法」第13條附表1所定旨揭設施高度超過14公尺,應檢附證明文件規定,因本案設施高度18.9公尺,係該農會委由廠商依實際生產需求設計訂做,可請農會提供財團法人農業機械化研究發展中心就本案計畫工程規劃書及設計圖核定函做為證明文件,予以認定。(本署補助案件)
