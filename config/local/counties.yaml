      - GL001239  # 官方標示「廢」（2026-10-30 同步發現），不收錄
      - FL035348  # 官方標示「廢」（2026-10-30 同步發現），不收錄
      - GL001919  # 官方標示「廢/停」（2026-10-30 首次同步發現），不收錄
      - GL000534  # 官方標示「廢/停」（2026-10-30 首次同步發現），不收錄
