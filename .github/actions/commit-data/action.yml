name: commit-data
description: Commit data/ changes and push with rebase retries (never force-push).
inputs:
  message: {required: true, description: commit message}
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        git config user.name "agri-law-bot"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data
        if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
        git commit -q -m "${{ inputs.message }}"
        for i in 1 2 3; do
          git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
          echo "push attempt $i failed, retrying"; sleep $((i*10))
        done
        echo "::error::could not push data commit"; exit 1
