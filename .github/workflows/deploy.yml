# 建置並部署 GitHub Pages。資料更新流程以 workflow_call 直接呼叫（不依賴 GITHUB_TOKEN push 觸發）。
# 建置失敗時不會部署，正式網站維持上一個成功版本。
name: deploy
on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", "config/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: build data
        working-directory: scripts
        env: {GITHUB_SHA: "${{ github.sha }}"}
        run: python -m agrilaw.cli build
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - working-directory: web
        run: npm ci && npm run build
      - name: sanity check build
        run: |
          test -s web/dist/index.html
          python - <<'PY'
          import json; m=json.load(open("web/dist/data/manifest.json"))
          assert m["counts"]["laws"] > 0, "no laws in build"
          print(m["counts"])
          PY
      - uses: actions/upload-pages-artifact@v3
        with: {path: web/dist}
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
      - name: verify deployed site
        run: |
          url="${{ steps.d.outputs.page_url }}data/manifest.json"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url" -o m.json; then python3 -c "import json;m=json.load(open('m.json'));print('deployed build',m['built_at'],m['counts'])"; exit 0; fi
            sleep 20
          done
          echo "::error::deployed manifest not reachable"; exit 1
