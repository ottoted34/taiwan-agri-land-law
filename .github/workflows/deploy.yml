# 建置並部署 GitHub Pages。資料更新流程以 workflow_call 直接呼叫（不依賴 GITHUB_TOKEN push 觸發）。
# 建置失敗時不會部署，正式網站維持上一個成功版本。
name: deploy
on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", "config/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      built_at: ${{ steps.sanity.outputs.built_at }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: build data
        working-directory: scripts
        env: {GITHUB_SHA: "${{ github.sha }}"}
        run: python -m agrilaw.cli build
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - working-directory: web
        run: npm ci && npm run build
      - name: sanity check build
        id: sanity
        run: |
          test -s web/dist/index.html
          python - <<'PY'
          import json, os; m=json.load(open("web/dist/data/manifest.json"))
          assert m["counts"]["laws"] > 0, "no laws in build"
          assert m["counts"]["interps"] > 0, "no interpretations in build"
          print(m["counts"])
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"built_at={m['built_at']}\n")
          PY
      - uses: actions/upload-pages-artifact@v3
        with: {path: web/dist}
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
      - name: verify deployed site
        run: |
          want="${{ needs.build.outputs.built_at }}"
          for i in $(seq 1 15); do
            url="${{ steps.d.outputs.page_url }}data/manifest.json?nocache=$(date +%s)"
            got=$(curl -fsS -H 'Cache-Control: no-cache' "$url" | python3 -c "import json,sys;print(json.load(sys.stdin)['built_at'])" || true)
            echo "attempt $i: live=$got expected=$want"
            if [ "$got" = "$want" ]; then echo "new build is live"; exit 0; fi
            sleep 20
          done
          echo "::error::live site does not serve the new build"; exit 1
