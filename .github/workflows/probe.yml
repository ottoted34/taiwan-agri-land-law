name: probe-sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/tools/probe_urls.py scripts/tools/probe_list.txt tests/fixtures/live3
      - name: commit samples
        run: |
          git config user.name "agri-law-bot"; git config user.email "actions@users.noreply.github.com"
          git add tests/fixtures
          git commit -m "chore: probe official source samples [skip ci]" || echo "nothing"
          git push
