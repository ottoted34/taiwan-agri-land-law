# 法規與函釋同步。每日臺灣時間 03:20（UTC 19:20）；每週日 02:40（UTC 週六 18:40）完整比對。
name: update-laws
on:
  schedule:
    - cron: "20 19 * * *"   # daily 03:20 Asia/Taipei
    - cron: "40 18 * * 6"   # weekly full compare, Sunday 02:40 Asia/Taipei
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | weekly | full"
        default: daily
        type: choice
        options: [daily, weekly, full]
      only:
        description: "只執行指定來源（以逗號分隔，留空＝全部），例：forest-interpretations,talis-green-energy"
        default: ""
permissions:
  contents: write
concurrency:
  group: data-write
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      result: ${{ steps.sync.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}  # latest data: runs are serialized, so this never conflicts
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.mode }}";
          elif [ "${{ github.event.schedule }}" = "40 18 * * 6" ]; then m=weekly; else m=daily; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - name: sync
        id: sync
        working-directory: scripts
        env: {ONLY: "${{ inputs.only }}"}
        run: |
          set +e
          python -m agrilaw.cli sync --mode ${{ steps.mode.outputs.mode }} --only "$ONLY" | tee ../sync-output.json
          code=${PIPESTATUS[0]}
          echo "result=$(python -c "import json;print(json.load(open('../sync-output.json'))['result'])")" >> "$GITHUB_OUTPUT"
          echo "exit code $code"
          # partial failures are recorded in data/updates; only a total failure fails the job (after committing the log)
          echo "$code" > ../sync-exit
      - name: tests on fresh data
        run: python -m pytest -q tests/test_parsers.py tests/test_rules.py
      - uses: ./.github/actions/commit-data
        with:
          message: "data: ${{ steps.mode.outputs.mode }} sync (${{ steps.sync.outputs.result }}) [run ${{ github.run_id }}]"
      - name: fail when every source failed
        run: test "$(cat sync-exit)" != "2"
  deploy:
    needs: sync
    if: always() && needs.sync.result != 'cancelled'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
