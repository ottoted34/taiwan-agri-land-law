# 維護用：檢查 RMIS 函釋列表每頁筆數；報告與異常頁面推送到獨立的 diagnostics 分支（不影響 main 與網站）
name: diagnose
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rmis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - working-directory: scripts
        run: python -m agrilaw.cli diagnose --out ../diagnostics
      - uses: actions/upload-artifact@v4
        with: {name: diagnostics, path: diagnostics, retention-days: 7}
      - name: publish to diagnostics branch
        run: |
          cd diagnostics
          git init -q -b diagnostics
          git config user.name "agri-law-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "diagnostics run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnostics
