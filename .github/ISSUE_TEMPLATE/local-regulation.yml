name: 提供地方規定
description: 提供縣市政府農地相關自治法規、審查要點等地方規定，經管理者審核後收錄
title: "[地方規定] 縣市－法規名稱"
labels: ["local-regulation", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        感謝提供！請只填寫**已公開之官方資料**，並務必附上官方網址（縣市法規查詢系統、縣市政府或公報網頁）。
        - 本表單內容會**公開**在 GitHub，請勿填寫個人姓名、電話、身分證字號、地號或任何個案資料。
        - 收錄須經管理者至官方網址核對名稱、日期與全文後才會上線；未經核對之內容不會出現在網站。
        - 本網站為非官方整理平台，收錄不代表機關認可。
  - type: dropdown
    id: county
    attributes:
      label: 縣市
      options: [臺北市, 新北市, 桃園市, 臺中市, 臺南市, 高雄市, 基隆市, 新竹市, 嘉義市, 新竹縣, 苗栗縣, 彰化縣, 南投縣, 雲林縣, 嘉義縣, 屏東縣, 宜蘭縣, 花蓮縣, 臺東縣, 澎湖縣, 金門縣, 連江縣]
    validations: {required: true}
  - type: input
    id: name
    attributes:
      label: 法規名稱
      description: 請照官方全銜填寫
      placeholder: 例：臺中市申請農業用地作農業設施容許使用審查要點
    validations: {required: true}
  - type: input
    id: url
    attributes:
      label: 官方網址（必填）
      description: 必須是政府機關網域（gov.tw）之官方頁面，可直接看到法規全文或發布令
      placeholder: https://law.taichung.gov.tw/LawContent.aspx?id=GL000357
    validations: {required: true}
  - type: input
    id: published
    attributes:
      label: 發布或最新修正日期
      placeholder: 例：民國113年2月21日（府授農地字第1130041756號令）
    validations: {required: true}
  - type: input
    id: effective
    attributes:
      label: 施行日期
      description: 官方未載明者請填「未載明」或「自發布日施行」
      placeholder: 例：自發布日施行
    validations: {required: true}
  - type: input
    id: unit
    attributes:
      label: 提供者單位（選填）
      description: 只填機關或單位名稱即可，不需填個人姓名
      placeholder: 例：○○縣政府農業處
    validations: {required: false}
  - type: textarea
    id: note
    attributes:
      label: 補充說明（選填）
      description: 例如與哪些審查情境相關、是否已廢止舊規定。請勿貼上個案資料。
    validations: {required: false}
  - type: checkboxes
    id: confirm
    attributes:
      label: 確認事項
      options:
        - label: 我提供的是已公開之官方資料，且已附官方網址
          required: true
        - label: 本表單未包含個人資料或個案資料
          required: true
